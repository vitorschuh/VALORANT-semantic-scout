# Extra services next to the Astro Airflow stack. Picked up automatically by `astro dev start`.
# Astro puts the Airflow services on the `airflow` network; the extra services must join it
# or hostnames like kafka / minio / serving-db do not resolve from the Airflow containers.
services:
  serving-db:
    networks: [airflow]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: valorant
      POSTGRES_PASSWORD: valorant
      POSTGRES_DB: serving
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
    ports: ["5433:5432"]
    volumes:
      - serving-db:/var/lib/postgresql/data
      - ./include/sql/init_pgvector.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./include/sql/init_pgvector.sql:/sql/init_pgvector.sql:ro

  # MinIO stopped publishing official images (minio/minio, minio/mc) in late 2025.
  # Chainguard builds of the same binaries, pinned by digest for reproducibility.
  minio:
    networks: [airflow]
    image: cgr.dev/chainguard/minio@sha256:0a01100085e30fb08d2f39e39c9f5c9d83a95707f220b007d813b690cd41622d
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  # No shell in this image: mc retries via restart policy until MinIO is up.
  minio-init:
    networks: [airflow]
    image: cgr.dev/chainguard/minio-client@sha256:3b67177c0e12f44f646a5cf21b20fc5a79dd2d7a6b4db632b436f0b9e2e46717
    depends_on: [minio]
    environment:
      MC_HOST_local: http://minio:minio12345@minio:9000
    command: ["mb", "--ignore-existing", "local/lake"]
    restart: on-failure

  # Single-node Kafka in KRaft mode (no ZooKeeper). PLAINTEXT on :9092 is for containers on the Airflow
  # network; :9094 is advertised as localhost for tools on the host. Pinned by digest.
  kafka:
    image: apache/kafka@sha256:3f7b939115cd4872e9cee9369d80bd69712fde55f9902f46d793f64848dedc75
    networks: [airflow]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports: ["9094:9094"]
    volumes: [kafka:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

volumes:
  kafka:
  serving-db:
  minio:
